<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>닥터배 오프라인 세미나</title>
<meta name="description" content="닥터배 오프라인 세미나용 자료 모음 — 고객 안내 · 입점 주문 · 제품 라인업 · 마이크로젝션 · 두피 케어를 탭 하나로">

<meta property="og:type" content="website">
<meta property="og:site_name" content="닥터배 메디컬 에스테틱">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://baelab-create.github.io/drbae-off-line-seminar/">
<meta property="og:title" content="닥터배 오프라인 세미나">
<meta property="og:description" content="세미나 자료 5종을 탭 하나로 — 고객 안내 · 입점 주문 · 제품 라인업 · 마이크로젝션 · 두피 케어">

<link rel="stylesheet" href="https://baelab-create.github.io/drbae-fonts/gmarket.css">
<style>
  :root{
    --desk:#6B6058;          /* 바깥 책상 바탕 */
    --desk-d:#574E47;
    --red:#FF4F4F;           /* 탭 빨강 — 레퍼런스 실측 */
    --red-d:#F55B57;
    --red-dim:#EC524E;
    --paper:#FFFFFF;
    --ink:#2B2B2B;
    --sub:#8A8178;
    --tab-h:58px;
    --gap:18px;
    --slant:30px;      /* 사선 때문에 좌우로 빠지는 양 = tan(46°)×탭높이 ÷ 2 */
    --skew:46deg;      /* 레퍼런스 실측값 — 아래가 오른쪽으로 기움 */
    --round:13px;
    --tab-drop:6px;    /* 빨간 탭이 흰 탭보다 낮게 시작하는 만큼 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Gmarket Sans","Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    font-weight:500;
    background:linear-gradient(160deg,var(--desk) 0%,var(--desk-d) 100%);
    color:var(--ink);
    overflow:hidden;
  }

  .deck{
    position:fixed;inset:var(--gap);
    display:flex;flex-direction:column;
  }

  /* ---------- 탭 바 ----------
     레퍼런스처럼 '모서리가 둥근 사선 탭'. 배경만 skewX 로 기울이고 radius 를 주어
     바깥쪽 끝은 둥글게, 탭끼리 겹치는 안쪽은 사선 경계로 보이게 한다. */
  .tabbar{
    position:relative;z-index:80;
    display:flex;align-items:stretch;height:var(--tab-h);flex:0 0 auto;
    /* 탭 조각들이 아래로 14px 삐져나오게 만들어 두고 여기서 평평하게 자른다.
       본문 패널보다 위에 놓아, 패널 그림자가 흰 탭을 흐리게 덮지 않도록 한다 */
    overflow:hidden;
    filter:drop-shadow(0 7px 16px rgba(0,0,0,.34));
  }

  .brand{
    position:relative;z-index:60;flex:0 0 auto;
    color:var(--ink);background:none;
    padding:9px calc(var(--slant) * .5) 9px 26px;
    display:flex;flex-direction:column;justify-content:center;
  }
  /* 흰 탭의 곧은 왼쪽 — 오른쪽 끝을 조금 남겨 두어 사선 조각의 둥근 모서리가 드러나게 한다 */
  .brand::before{
    content:"";position:absolute;z-index:-1;
    left:0;right:20px;top:0;bottom:-14px;
    background:var(--paper);border-radius:var(--round) 0 0 0;
  }
  /* 흰 탭의 둥근 사선 오른쪽 끝 — 아래쪽이 비지 않도록 넉넉히 넓게 */
  .brand::after{
    content:"";position:absolute;z-index:-2;top:0;bottom:-14px;
    right:calc(var(--slant) * -1);width:calc(var(--slant) * 2 + 40px);
    background:var(--paper);border-radius:var(--round);
    transform:skewX(var(--skew));
    box-shadow:4px 0 10px rgba(0,0,0,.33);
  }
  .brand .bt{font-size:1.18rem;font-weight:700;font-style:italic;letter-spacing:.01em;white-space:nowrap;}
  .brand .bs{font-size:.62rem;font-weight:300;color:var(--sub);margin-top:3px;white-space:nowrap;}

  .tabs{display:flex;align-items:stretch;flex:1;min-width:0;}
  .tab{
    position:relative;appearance:none;border:0;background:none;cursor:pointer;font:inherit;
    color:#FFEDEC;font-weight:700;font-size:.86rem;letter-spacing:.01em;white-space:nowrap;
    padding:0 calc(var(--slant) * .5 + 9px);margin-left:calc(var(--slant) * -1);
    flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
    transition:color .18s;
  }
  /* 기울인 배경 — 흰 탭보다 5px 낮게 시작하고, 아래쪽 둥근 모서리는 슬라이드가 덮는다.
     그림자는 왼쪽 탭이 오른쪽 탭 위로 드리우는 방향(레퍼런스와 동일) */
  .tab::before{
    content:"";position:absolute;z-index:-1;left:0;right:0;top:var(--tab-drop);bottom:-14px;
    background:var(--red-dim);border-radius:var(--round);
    transform:skewX(var(--skew));
    box-shadow:4px 0 10px rgba(0,0,0,.33);
    transition:background .18s;
  }
  /* 첫 탭은 흰 탭의 사선이 더 깊이 덮으므로 왼쪽 여백을 더 준다 */
  .tab:first-child{padding-left:calc(var(--slant) * 1.4 + 8px);}
  .tab:hover{color:#fff;}
  .tab:hover::before{background:var(--red-d);}
  .tab.on{color:#fff;}
  .tab.on::before{background:var(--red);}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:-6px;border-radius:4px;}
  .tab .num{font-size:.68rem;font-weight:300;opacity:.82;margin-right:7px;}
  /* 마지막 탭의 둥근 사선 끝이 들어갈 자리 */
  .tabend{flex:0 0 calc(var(--slant) + 2px);}

  /* ---------- 본문(슬라이드) ---------- */
  .stage{
    flex:1;min-height:0;position:relative;z-index:70;
    background:var(--paper);
    border-radius:0 6px 6px 6px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
    overflow:hidden;
  }
  .stage iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    opacity:0;pointer-events:none;
  }
  .stage iframe.on{opacity:1;pointer-events:auto;}

  /* ---------- 아래 도구 줄 ---------- */
  .foot{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:10px 4px 0;color:#E6DFD7;font-size:.74rem;font-weight:300;
  }
  .foot .now{font-weight:700;color:#fff;font-size:.8rem;}
  .foot .spacer{flex:1;}
  .foot a{
    color:#fff;text-decoration:none;font-weight:500;font-size:.74rem;
    background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;
    transition:background .15s;
  }
  .foot a:hover{background:rgba(255,255,255,.26);}
  .foot kbd{
    font-family:inherit;font-size:.68rem;background:rgba(0,0,0,.22);
    border-radius:5px;padding:2px 6px;margin:0 1px;
  }

  /* ---------- 좁은 화면 ---------- */
  @media(max-width:1100px){
    :root{--gap:10px;--tab-h:52px;--slant:27px;--round:11px;--tab-drop:5px;}
    .brand{padding:8px calc(var(--slant) * .5) 8px 16px;border-radius:10px 0 0 0;}
    .brand .bt{font-size:.95rem;}
    .brand .bs{display:none;}
    .tabs{overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:0 0 auto;font-size:.78rem;padding:0 calc(var(--slant) * .5 + 6px);}
    .foot .keys{display:none;}
  }
  @media(max-width:480px){
    .tab .num{display:none;}
  }
</style>
</head>
<body>

<div class="deck">
  <header class="tabbar">
    <div class="brand">
      <span class="bt">DR.BAE SEMINAR</span>
      <span class="bs">닥터배 오프라인 세미나 자료 — 협약 샵 원장님 전용</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="세미나 자료"></nav>
    <span class="tabend"></span>
  </header>

  <main class="stage" id="stage"></main>

  <div class="foot">
    <span class="now" id="now"></span>
    <span class="keys">탭 이동 <kbd>1</kbd>~<kbd id="klast">5</kbd> 또는 <kbd>←</kbd><kbd>→</kbd></span>
    <span class="spacer"></span>
    <a id="open" href="#" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
  </div>
</div>

<script>
const PAGES = [
  { t:"고객 안내",    u:"https://baelab-create.github.io/drbae-customer/" },
  { t:"입점·주문",    u:"https://baelab-create.github.io/drbae-guide/" },
  { t:"제품 라인업",  u:"https://baelab-create.github.io/drbae-lineup/" },
  { t:"마이크로젝션", u:"https://baelab-create.github.io/Microjection_Skin-care/" },
  { t:"두피 케어",    u:"https://baelab-create.github.io/Scalp_Care/" },
  { t:"전문점 안내",  u:"https://baelab-create.github.io/drbae-partner-seminar/" }
];

const tabsEl = document.getElementById('tabs');
const stage  = document.getElementById('stage');
const nowEl  = document.getElementById('now');
const openEl = document.getElementById('open');

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.type = 'button';
  b.innerHTML = '<span class="num">0' + (i+1) + '</span>' + p.t;
  b.style.zIndex = 50 - i;          /* 왼쪽 탭이 오른쪽 탭 위로 겹치게 */
  b.addEventListener('click', () => show(i));
  tabsEl.appendChild(b);

  const f = document.createElement('iframe');
  f.title = p.t;
  f.loading = 'lazy';
  stage.appendChild(f);
});

let cur = -1;
function show(i){
  if (i < 0 || i >= PAGES.length) return;
  cur = i;
  const tabs = tabsEl.children, frames = stage.children;
  for (let k = 0; k < PAGES.length; k++){
    tabs[k].classList.toggle('on', k === i);
    tabs[k].style.zIndex = (k === i) ? 55 : 50 - k;
    tabs[k].setAttribute('aria-current', k === i ? 'page' : 'false');
    frames[k].classList.toggle('on', k === i);
  }
  /* 한 번 연 탭은 그대로 두어 다시 눌렀을 때 바로 나오게 한다 */
  if (!frames[i].src) frames[i].src = PAGES[i].u;
  nowEl.textContent = PAGES[i].t;
  openEl.href = PAGES[i].u;
  if (location.hash !== '#' + (i+1)) history.replaceState(null, '', '#' + (i+1));
  tabs[i].scrollIntoView({block:'nearest', inline:'nearest'});
}

document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key >= '1' && e.key <= String(PAGES.length)) show(+e.key - 1);
  else if (e.key === 'ArrowRight') show((cur + 1) % PAGES.length);
  else if (e.key === 'ArrowLeft')  show((cur - 1 + PAGES.length) % PAGES.length);
});

document.getElementById('klast').textContent = PAGES.length;

const start = parseInt(location.hash.replace('#',''), 10);
show(Number.isInteger(start) && start >= 1 && start <= PAGES.length ? start - 1 : 0);
</script>
</body>
</html>
